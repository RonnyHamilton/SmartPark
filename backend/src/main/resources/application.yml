server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: smartpark-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartpark}
    username: ${DB_USERNAME:smartpark}
    password: ${DB_PASSWORD:smartpark_dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false
  server:
    port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

app:
  security:
    jwt-secret: ${JWT_SECRET:c21hcnRwYXJrLWRldmVsb3BtZW50LW9ubHktc2VjcmV0LWNoYW5nZS1tZS0yMDI2}
    access-token-ttl-minutes: ${ACCESS_TOKEN_TTL_MINUTES:15}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-domain: ${COOKIE_DOMAIN:}
    cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}
    login-max-attempts: 5
    login-lock-minutes: 15
    rate-limit-per-minute: 20
  demo-data: ${SEED_DEMO_DATA:true}
  # Optional one-time production bootstrap. Leave empty when demo seeding is used.
  bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
  bootstrap-admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  bootstrap-admin-name: ${BOOTSTRAP_ADMIN_NAME:SmartPark Administrator}
  dev-expose-reset-token: ${DEV_EXPOSE_RESET_TOKEN:false}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:no-reply@smartpark.local}

logging:
  level:
    root: INFO
    com.smartpark: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
